<!-- booking.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронирование</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo-link"><h1 class="logo">Сладкие сны 🌙</h1></a>
        </div>
    </header>

    <main class="container page-content">
        <div class="booking-card">
            <h2>Оформление брони</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" name="name" required pattern="[а-яА-ЯёЁ\s\.\-]+" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" name="surname" required pattern="[а-яА-ЯёЁ\s\.\-]+" placeholder="Иванов">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" name="phone" required pattern="\+7\(\d{3}\)\d{3}-\d{2}-\d{2}" placeholder="+7(999)000-00-00">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата заезда</label>
                        <input type="date" name="checkin" required>
                    </div>
                    <div class="form-group">
                        <label>Дата выезда</label>
                        <input type="date" name="checkout" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary full-width">Отправить заявку</button>
            </form>
            <div id="messageBox" class="message-box"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
