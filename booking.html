<!-- booking.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Бронирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>Бронирование номера</h1></header>
    <main>
        <form id="bookingForm">
            <input type="text" name="name" placeholder="Имя" required pattern="[а-яА-ЯёЁ\s\.\-]+">
            <input type="text" name="surname" placeholder="Фамилия" required pattern="[а-яА-ЯёЁ\s\.\-]+">
            <input type="tel" name="phone" placeholder="+7(XXX)XXX-XX-XX" required pattern="\+7\(\d{3}\)\d{3}-\d{2}-\d{2}">
            <input type="email" name="email" placeholder="Email" required>
            <input type="date" name="checkin" required>
            <input type="date" name="checkout" required>
            <button type="submit">Отправить заявку</button>
        </form>
        <div id="message"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
